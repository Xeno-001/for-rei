<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fffdfd" />
<meta name="description" content="For Reisya My Love." />
<title>Happy Birthday, Reisya! ♡</title>
<style>
  :root{
    --paper:#fffdfd; --white:#ffffff; --ink:#5e4d54; --muted:#9c8991;
    --pink:#f6c9d6; --pink2:#ffe7ee; --pink3:#fbeff3; --rose:#d987a2;
    --line:#f4e4e9; --shadow:0 18px 55px rgba(185,126,147,.13);
    --serif: Georgia, 'Times New Roman', serif;
    --sans: ui-rounded, 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html{min-height:100%; background:var(--paper); scroll-behavior:smooth}
  body{margin:0; min-height:100vh; color:var(--ink); font-family:var(--sans); background:
    radial-gradient(ellipse at 10% 8%,rgba(255,229,237,.7),transparent 32%),
    radial-gradient(ellipse at 90% 90%,rgba(255,241,246,.9),transparent 32%), #fffdfd; overflow-x:hidden}
  button{font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:3px solid #e7a7bc;outline-offset:4px}
  .ambient{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
  .ambient .spark{position:absolute; color:#f1c2d1; opacity:.65; animation:drift 10s ease-in-out infinite}
  .ambient .spark:nth-child(1){left:7%;top:21%;font-size:16px;animation-delay:-2s}
  .ambient .spark:nth-child(2){right:8%;top:16%;font-size:22px;animation-delay:-5s}
  .ambient .spark:nth-child(3){left:13%;bottom:15%;font-size:20px;animation-delay:-3s}
  .ambient .spark:nth-child(4){right:12%;bottom:22%;font-size:14px;animation-delay:-7s}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-13px) rotate(8deg)}}
  .app{position:relative;z-index:1; min-height:100svh; display:flex; flex-direction:column; align-items:center; padding:20px 16px max(18px,env(safe-area-inset-bottom));}
  .topline{width:min(760px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 auto 13px;color:#b69aa5;font-size:11px;letter-spacing:.15em;text-transform:uppercase}
  .tiny-heart{color:#e2a2b7;font-size:16px;animation:heartbeat 2.4s ease-in-out infinite}
  @keyframes heartbeat{0%,100%{transform:scale(1)}8%{transform:scale(1.23)}16%{transform:scale(1)}}
  .progress-wrap{width:min(760px,100%);height:4px;background:#f6ebef;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .progress{height:100%;width:0;background:linear-gradient(90deg,#edbfd0,#dfa0b8);border-radius:99px;transition:width .55s cubic-bezier(.2,.8,.2,1)}
  main{width:min(760px,100%);flex:1;display:flex;align-items:center;justify-content:center;}
  .stage{width:100%;animation:pageIn .58s cubic-bezier(.2,.75,.25,1) both;}
  .stage.leaving{animation:pageOut .2s ease both}
  @keyframes pageIn{from{opacity:0;transform:translateY(15px) scale(.99);filter:blur(3px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
  @keyframes pageOut{to{opacity:0;transform:translateY(-8px) scale(.99);filter:blur(3px)}}
  .paper{background:rgba(255,255,255,.91);border:1px solid rgba(244,221,230,.92);border-radius:28px;box-shadow:var(--shadow);padding:clamp(23px,5vw,46px);position:relative;overflow:hidden}
  .paper:before{content:"";position:absolute;top:0;left:12%;right:12%;height:3px;background:linear-gradient(90deg,transparent,#f4c8d6,transparent)}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c48da1;margin:0 0 13px;font-weight:700}
  h1,h2,h3,p{margin-top:0}
  h1,h2{font-weight:600;letter-spacing:-.035em;line-height:1.15;color:#725b64}
  h1{font-size:clamp(34px,8vw,58px);margin-bottom:15px}
  h2{font-size:clamp(27px,6vw,40px);margin-bottom:13px}
  h3{font-size:clamp(20px,4.5vw,26px);font-weight:600;color:#7d626c}
  .subtitle{font-size:15px;line-height:1.8;color:#a18c95;max-width:470px;margin:0 auto}
  .cover{text-align:center;padding-top:clamp(18px,3vh,32px);padding-bottom:clamp(23px,4vh,37px)}
  .cover h1{max-width:600px;margin-left:auto;margin-right:auto}
  .cover .subtitle{margin-bottom:16px}
  .cat-zone{width:min(280px,72vw);height:auto;margin:2px auto 13px;position:relative;cursor:pointer;touch-action:manipulation;user-select:none;filter:drop-shadow(0 13px 14px rgba(228,172,192,.18));transition:transform .2s ease;outline:none}
  .cat-zone:active{transform:scale(.97)}
  .cat-zone svg{width:100%;height:auto;display:block;overflow:visible}
  .cat-zone img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
  .cat-zone.petted{animation:catPet .45s ease}
  @keyframes catPet{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(-4deg) scale(1.05)}70%{transform:rotate(4deg) scale(1.04)}}
  .cat-tail{transform-origin:208px 166px;animation:tail 2.4s ease-in-out infinite}
  @keyframes tail{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(13deg)}}
  .cat-body{transform-origin:150px 230px;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .cat-ear{transform-origin:center;animation:ear 5s ease-in-out infinite}
  @keyframes ear{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-7deg)}96%{transform:rotate(5deg)}}
  .eye{transform-origin:center;animation:blink 4.4s infinite}
  @keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}
  .tap-hint{font-size:12px;color:#bd8fa0;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:7px}
  .tap-hint .finger{display:inline-block;animation:tapHint 1.4s ease-in-out infinite}
  @keyframes tapHint{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .btn{border:0;border-radius:999px;padding:13px 21px;background:#f3c9d7;color:#7d5866;font-size:13px;font-weight:700;letter-spacing:.01em;box-shadow:0 7px 18px rgba(221,160,182,.2);transition:transform .2s,background .2s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px}
  .btn:hover{background:#f8d8e2;transform:translateY(-2px);box-shadow:0 10px 22px rgba(221,160,182,.26)}
  .btn:active{transform:scale(.97)}
  .btn.secondary{background:#fff;color:#a47a8b;border:1px solid #f1dbe3;box-shadow:none}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:24px}
  .letter-content p{font-family:var(--serif);font-size:clamp(16px,2.1vw,18px);line-height:1.9;color:#6f5b63;margin:0 0 17px;white-space:normal}
  .letter-content p:last-child{margin-bottom:0}
  .letter-content em{color:#bb8297}
  .signature{font-family:var(--serif);font-style:italic;color:#b97e95;font-size:19px;line-height:1.9;margin-top:17px}
  .letter-no{display:flex;align-items:center;gap:10px;color:#c49aaa;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:20px}
  .letter-no:after{content:"";height:1px;background:#f2dfe6;flex:1}
  .envelope-wrap{text-align:center}
  .envelope{width:min(270px,70vw);height:190px;position:relative;margin:20px auto 16px;border:0;background:transparent;display:block;perspective:800px;filter:drop-shadow(0 12px 12px rgba(204,156,174,.15));touch-action:manipulation}
  .env-back{position:absolute;inset:18px 10px 0;background:#ffe7ee;border-radius:12px}
  .env-paper{position:absolute;left:27px;right:27px;top:38px;height:116px;background:#fff;border:1px solid #f7dfe7;border-radius:7px;transition:transform .65s cubic-bezier(.2,.8,.2,1);z-index:1;display:flex;align-items:center;justify-content:center;color:#c28ba0;font-size:28px}
  .env-front{position:absolute;inset:52px 10px 0;background:#f8d4e0;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:0 0 12px 12px;z-index:3}
  .env-flap{position:absolute;left:10px;right:10px;top:18px;height:95px;background:#fce1e9;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .65s cubic-bezier(.2,.8,.2,1);z-index:4;filter:brightness(.99)}
  .env-seal{position:absolute;z-index:5;top:88px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:#df9fb5;color:white;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 10px rgba(179,122,145,.18);transition:opacity .25s,transform .4s}
  .envelope.open .env-flap{transform:rotateX(180deg)}
  .envelope.open .env-paper{transform:translateY(-72px) scale(1.04);z-index:5}
  .envelope.open .env-seal{opacity:0;transform:translateX(-50%) scale(.2)}
  .revealed-note{background:#fffafb;border:1px dashed #edc8d6;border-radius:18px;padding:22px 22px;margin:10px auto 0;text-align:left;max-width:540px;animation:noteIn .6s cubic-bezier(.2,.75,.25,1) both;position:relative}
  @keyframes noteIn{from{opacity:0;transform:translateY(12px) rotate(-1deg) scale(.97)}to{opacity:1;transform:none}}
  .revealed-note p{font-family:var(--serif);font-size:clamp(16px,2.5vw,18px);line-height:1.85;margin:0;color:#745c66}
  .note-heart{display:block;text-align:center;color:#d99bb0;font-size:22px;margin-bottom:10px;animation:heartbeat 2s infinite}
  .final-cat{width:min(230px,62vw);margin:0 auto 10px;animation:bob 3s infinite ease-in-out}
  .final-cat svg{display:block;width:100%}
  .footer-nav{width:min(760px,100%);display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;min-height:45px}
  .nav-btn{border:1px solid #f1e0e6;background:rgba(255,255,255,.75);color:#a88995;border-radius:999px;min-height:38px;padding:9px 14px;font-size:12px;display:inline-flex;align-items:center;gap:7px;transition:.2s}
  .nav-btn:hover{background:#fff1f5;color:#926778}
  .nav-btn:disabled{opacity:0;pointer-events:none}
  .counter{font-size:11px;color:#c3a7b2;letter-spacing:.12em;text-transform:uppercase;text-align:center}
  .paw{position:fixed;pointer-events:none;z-index:20;font-size:21px;opacity:0;animation:pawFloat 1.15s ease-out forwards;filter:drop-shadow(0 3px 3px #fbe7ee)}
  @keyframes pawFloat{0%{opacity:0;transform:translate(-50%,-30%) scale(.4) rotate(-20deg)}20%{opacity:.9}100%{opacity:0;transform:translate(-50%,-130%) scale(1.1) rotate(22deg)}}
  .heart-pop{position:fixed;pointer-events:none;z-index:20;color:#e8a6bc;opacity:0;animation:heartPop 1.25s ease-out forwards}
  @keyframes heartPop{0%{opacity:0;transform:translate(-50%,-20%) scale(.4) rotate(-12deg)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-130% - var(--dy))) scale(1.25) rotate(18deg)}}
  .sparkle{position:absolute;color:#edb2c5;animation:sparkle 1.5s ease-in-out infinite}
  @keyframes sparkle{0%,100%{opacity:.4;transform:scale(.75) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(40deg)}}
  .soft-divider{height:1px;width:80px;background:#eed7e0;margin:20px auto}
  .closing-line{font-family:var(--serif);font-style:italic;font-size:clamp(22px,5vw,34px);color:#c47f99;line-height:1.55}
  .tiny-note{font-size:11px;color:#b6a1aa;line-height:1.7}

  .sticker-stage{display:flex;align-items:center;flex-direction:column;text-align:center;margin:2px auto 15px}
  .sticker-button{border:0;background:transparent;padding:0;margin:0 auto;width:min(365px,84vw);max-width:100%;display:block;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 12px 15px rgba(196,127,153,.13));-webkit-tap-highlight-color:transparent}
  .sticker-button img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;transition:filter .3s ease;animation:stickerFloat 3.8s ease-in-out infinite}
  .sticker-button:active img{filter:saturate(1.08)}
  .sticker-button.hugging{animation:stickerCuddle .9s cubic-bezier(.2,.8,.3,1) both}
  .sticker-button.hugging img{animation:none}
  @keyframes stickerFloat{0%,100%{transform:translateY(0) rotate(-1deg)}35%{transform:translateY(-7px) rotate(1deg)}68%{transform:translateY(-3px) rotate(-.6deg)}}
  @keyframes stickerCuddle{0%{transform:scale(1) rotate(0)}18%{transform:scale(1.08) rotate(-4deg)}35%{transform:scale(1.06) rotate(4deg)}55%{transform:scale(1.1) rotate(-3deg)}75%{transform:scale(1.04) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
  .sticker-hint{font-size:12px;color:#bd8fa0;margin:-2px auto 18px;display:flex;align-items:center;justify-content:center;gap:7px}
  .finale-paper{padding-top:clamp(22px,4vw,38px)}

  @media(min-width:700px){.app{padding-top:24px}.paper{border-radius:32px}.letter-content p{line-height:1.95}}
  @media(max-width:480px){.app{padding-left:12px;padding-right:12px}.topline{font-size:9px}.paper{border-radius:23px}.cat-zone{width:min(250px,70vw)}.footer-nav{margin-top:10px}.nav-btn{padding:8px 11px}.cover .subtitle{font-size:13px}.letter-content p{line-height:1.8}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="app">
  <div class="topline"><span>Happy Birthday Reisya!</span><span class="tiny-heart">♡</span><span>Special For You</span></div>
  <div class="progress-wrap" aria-label="Kemajuan hadiah"><div id="progress" class="progress"></div></div>

  <div class="footer-nav"><button class="nav-btn" id="backBtn" type="button" aria-label="Kembali">← <span>Kembali</span></button><div id="counter" class="counter">sebuah hadiah kecil ♡</div><button class="nav-btn" id="nextBtn" type="button" aria-label="Lanjut">Lanjut <span>→</span></button></div>
</div>

`<h3 style="margin-bottom:18px">Happy Birthday, Rei!</h3><p>Sekarang pukul 00.00 WIB, yang merupakan detik awal tanggal 21 Oktober 2026. Aku mengirim ini sekarang karena aku ingin menjadi orang pertama yang mengucapkan selamat atas naiknya levelmu :)</p>
<p>Di hari ulang tahunmu ini, aku menaruh sebuah harapan untukmu semoga kamu menjadi pribadi yang semakin baik dari hari ke hari. Memang abstrak, ya? Tapi justru keabstrakan itu yang menurutku menarik. Kamu punya kesempatan untuk menemukan sendiri apa arti menjadi lebih baik, bagaimana kamu ingin bertumbuh, dan seperti apa dirimu yang ingin kamu temui di masa depan. Aku harap kamu menikmati setiap proses untuk menemukannya.</p>`,
`<p>Aku juga sangat bahagia dan bersyukur bisa mengenalmu hingga sedekat ini. Banyak hal tentang kamu, dari yang sederhana hingga yang rumit, yang membuatku merasa bahwa kamu sangatlah berarti buatku, bahkan ketika kita sama sekali belum bertemu karena terhalang jarak kurang lebih 400 km.</p>
<p>Aku tahu hari ini adalah hari yang tepat untuk mengucapkan banyak kata manis kepadamu. Tapi, kalau boleh jujur, tulisan ini bukan sekadar ucapan yang kubuat secara spontan lalu kukirim begitu saja. Aku memikirkannya, mempertimbangkannya, dan mencoba merangkai kata-kata yang benar-benar ingin kusampaikan kepadamu. Bukan karena aku ingin terdengar puitis atau romantis, melainkan karena aku ingin kamu tahu bahwa ada ketulusan di balik setiap hal yang kutuliskan di sini.</p>`,
`<p>Intinya, aku ingin mendoakan hal-hal baik yang luar biasa untukmu.</p>
<p>Aku mendoakan keberuntungan dalam berbagai sendi kehidupanmu, ketenangan dalam menghadapi segala situasi, kesehatan yang menyertaimu sepanjang usia, kebahagiaan di setiap fase kehidupanmu, serta kemampuan, keberanian, dan kemudahan untuk menghadapi apa pun yang kelak datang menghampirimu. Aku berharap kamu selalu diberi kekuatan ketika harus bertahan, kelapangan hati ketika harus menerima, kebijaksanaan ketika harus memilih, dan keberanian ketika harus memulai sesuatu yang baru.</p>
<p>Pada akhirnya, aku mendoakan segala hal baik yang bisa mengantarkanmu pada kebahagiaan. Bukan hanya kebahagiaan yang terlihat dari luar, tetapi juga kebahagiaan yang bisa kamu rasakan jauh di dalam dirimu sendiri.</p>`,
`<p>Sulit. Bahagia bukanlah kata yang sederhana, tetapi bahagia merupakan hal yang, menurutku, diinginkan oleh semua manusia di muka bumi. Aku ingin mengingatkan bahwa kebahagiaanmu bukan hanya tercapai ketika kamu tidak merasakan kesulitan sedikit pun. Kebahagiaanmu hadir setiap saat, bahkan ketika dirimu sedang diterpa kesulitan sekalipun. Aku berdoa agar kebahagiaanmu menjadi kebahagiaan yang sejati dan penuh makna.</p>
<p>Berbicara mengenai <strong>kita</strong>, aku jelas tidak bisa menjanjikan seolah-olah aku sudah mengetahui segala hal yang akan datang di masa depan. Tapi, aku merasa bisa jujur tentang niatku kedepannya, yaitu aku ingin senantiasa mendapatkan kesempatan untuk mengenalmu, memahamimu, dan bersama-sama membangun sesuatu yang serius, baik dalam jangka dekat maupun panjang, yang tentunya secara sehat dan realistis.</p>`,
`<p>Aku juga paham betul kalau jarak bukanlah hal yang mudah, baik untukmu maupun untukku. Setiap kata yang kita berikan, baik melalui tulisan maupun suara, bukanlah sesuatu yang bisa menggantikan kehadiran fisik, meskipun kita sudah saling mengirimkan bukti fisik kita masing-masing, baik berupa diri kita maupun keadaan yang sedang kita alami.</p>
<p>Meski begitu, aku juga bersyukur atas jarak ini. Alasannya? Kurasa aku sudah pernah ku jelaskan panjang lebar. Jadi ya, untuk bagian itu, biarkan aku menghemat kata-kata dulu:)</p>
<p>Tapi, melalui jarak ini, aku merasa bisa perlahan mempersiapkan diri untuk suatu hari nanti jika kita melangkah lebih jauh. Aku ingin langkah kita dibangun tidak hanya berdasarkan cinta semata, tetapi juga atas dasar komitmen, usaha, tanggung jawab, dan keberanian untuk menanggung segala resiko kedepannya, baik maupun buruk, gembira maupun sedih, semangat maupun lelah.</p>`,
`<p>Yaa... walaupun ak belum siap ngasih status lebih daripada teman ke kamu tapi aku mau ingetin kalau ak bukan gamau, ak cuman merasa gabisa. Tapi, untuk sekarang, biarkan aku ikut merayakan naiknya levelmu!</p>
<p>Tentu saja bukan hanya karena hari ini adalah hari di mana kamu lahir (yang mana aku berterimakasih atas hal itu), tapi intinya karena ini adalah kamu, Rei... Reisya... Reisya Viandra Oktavia... Sayangku.</p>
<p>Jadi, sekali lagi, selamat ulang tahun, Rei!</p><div class="signature">Dengan ketulusan,<br><strong>Seno</strong></div>`
];

 {title:'When you miss me',icon:'♡',text:'Kalau kamu rindu aku, ingat aja kalau yaa aku juga merindukanmu, kwkwkwkwk. Ngl, though.'},
 {title:'When today feels heavy',icon:'☁',text:'Gausah diselesaiin semuanya sekaligus, kocak. Nggak semua hal bisa selesai dalam waktu singkat, dan nggak semua persoalan harus punya jawaban hari ini juga. And hey, chat me if you need me, cause I think I\'ll always want to be there for you, even though I can do nothing impactful.'},
 {title:'When you doubt yourself',icon:'✧',text:'Ngapain ngeraguin diri sendiri? Kocak apa? Aku aja pede sama seleraku wkwkwkwkwkk.'},
 {title:'When u need a smile',icon:'☻',text:'Kalau lagi pengen senyum-senyum sendiri, chat aja aku wkwkwkwkwkk<br><br>Atau, bisa juga lihat fotoku, dengerin suaraku, baca percakapan kita yang lama, atau apa pun itu. Semuanya sudah tersimpan rapi di percakapan kita, tinggal kamu buka aja. Anggap saja itu museum hehehehehe'},
 {title:'When u wonder about us',icon:'♥',text:'Mikirin apaan? Kejauhan, bro. Masih lama. Ya, maunya cepet sih, tapi aku rasa hitungan tahun akan tetap terpakai. Jadi, gausah terlalu dipikirkan. Kamu bisa percaya aku, dan aku rasa kamu harus percaya kalau aku percaya kamu. So, sabar aja aowkoawkawok.'},
 {title:'When u wonder about……',icon:'😾',text:'Cemburu ak keknya km mau dijemput ma Randy.. tch'}
];
const finaleText = `<p>Rei, sayangku, di usia barumu, bebanmu bertambah, umurmu berkurang, tapi itu juga diimbangi dengan pengalamanmu yang bertambah.</p>
<p>Makasih banget udah ada. Asli, ga bohong, suwer, kamu bener-bener salah satu sumber kebahagiaan terbesarku, sayang. Aku gatau masa depan tuh kayak gimana, tapi aku tahu masa kini. Aku bersyukur, aku berterima kasih, aku juga terharu bisa mengenalmu sampai sedekat ini.</p>`;

let stages = [];
stages.push({type:'cover'});
stages.push({type:'greeting'});
letterPages.forEach((html,i)=>stages.push({type:'letter',html,part:i+1,total:letterPages.length}));
stages.push({type:'notes-intro'});
littleNotes.forEach((note,i)=>stages.push({type:'note',note,index:i}));
stages.push({type:'finale'});
stages.push({type:'end'});
let current = 0;
let revealed = false;
const main = document.getElementById('main');
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');

function frame(inner, extra='') { return `<section class="stage ${extra}">${inner}</section>`; }
function catMarkup(cls='cat-zone') { return `<div class="${cls}" id="petCat" role="button" tabindex="0" aria-label="Sentuh untuk animasi lucu">${catSVG}<span class="sparkle" style="top:8%;right:0;font-size:20px">✦</span><span class="sparkle" style="bottom:24%;left:0;font-size:16px;animation-delay:-.7s">✧</span></div>`; }
function render(){
 revealed=false;
 const s=stages[current];
 let html='';
 if(s.type==='cover'){
  html=frame(`<div class="paper cover"><p class="eyebrow">a tiny gift, just for you ♡</p>${catMarkup()}<h1>Happy Birthday,<br><span style="color:#d58da7">Reisya!</span></h1><p class="subtitle">Ada hadiah kecil yang kubuat khusus untukmu.<br>Jangan buru-buru, ya. Bukanya pelan-pelan saja. 🤍</p><div class="tap-hint"><span class="finger">☝🏻</span> Sentuh atau usap gambarnya dulu!</div><button class="btn" id="startBtn">Mulai hadiah kecil ini <span>♡</span></button></div>`);
 } else if(s.type==='greeting'){
  html=frame(`<div class="paper cover"><p class="eyebrow">chapter 01 · your special day</p>${catMarkup()}<h2>Happy Birthday, Rei!</h2><p class="subtitle">Hari ini giliranmu dirayakan. Aku punya surat yang ingin kusampaikan, jadi tekan tombol di bawah kalau kamu sudah siap membacanya.</p><div class="actions"><button class="btn" id="letterStart">Baca suratku <span>→</span></button></div></div>`);
 } else if(s.type==='letter'){
  html=frame(`<article class="paper"><div class="letter-no"><span>surat utama</span><span>bagian ${s.part} dari ${s.total}</span></div><div class="letter-content">${s.html}</div><div class="actions"><button class="btn" id="letterNext">${s.part===s.total?'Ada pesan kecil lagi':'Lanjut membaca'} <span>→</span></button></div></article>`);
 } else if(s.type==='notes-intro'){
  html=frame(`<div class="paper cover"><p class="eyebrow">chapter 02 · little notes for you</p>${catMarkup()}<h2>Amplop kecil, untuk hari-hari yang berbeda.</h2><p class="subtitle">Ada enam pesan kecil yang ak siapin buat km, baca aja satu satu ini lebih santai dari sebelumnya. 🐾</p><div class="actions"><button class="btn" id="notesBegin">Buka amplop pertama <span>♡</span></button></div></div>`);
 } else if(s.type==='note'){
  const n=s.note;
  html=frame(`<article class="paper envelope-wrap"><p class="eyebrow">pesan kecil ${s.index+1} dari ${littleNotes.length}</p><h2 style="font-size:clamp(25px,6vw,37px)">${n.title}</h2><p class="subtitle">Ada pesan dariku di dalam amplop ini.</p><button class="envelope" id="envelope" aria-label="Sentuh untuk membuka amplop"><span class="env-back"></span><span class="env-paper">${n.icon}</span><span class="env-flap"></span><span class="env-front"></span><span class="env-seal">♡</span></button><p class="tap-hint" id="envelopeHint"><span class="finger">☝🏻</span> Sentuh amplop untuk membukanya</p><div id="noteSlot"></div><div class="actions" id="noteActions" style="display:none"><button class="btn" id="noteNext">${s.index===littleNotes.length-1?'Menuju penutup':'Amplop berikutnya'} <span>→</span></button></div></article>`);
 } else if(s.type==='finale'){
  html=frame(`<article class="paper cover finale-paper"><p class="eyebrow">chapter 03 · before you go…</p><h2>Before you go…</h2><div class="sticker-stage"><button class="sticker-button" id="loveStickerBtn" type="button" aria-label="Sentuh sticker untuk peluk virtual"><img id="loveSticker" src="${stickerData}" alt="Sticker dua karakter saling memeluk dengan kostum kucing, dihiasi hati merah muda"></button><p class="sticker-hint"><span class="finger">☝🏻</span> Sentuh sticker-nya untuk peluk virtual ♡</p></div><div class="letter-content" style="text-align:left;max-width:570px;margin:0 auto">${finaleText}</div><div class="soft-divider"></div><p class="closing-line">I love u so so so muchhh,<br>sayanggg. ♡</p><p class="tiny-note">— dari Seno, your love —</p><div class="actions"><button class="btn" id="finishBtn">Selesaikan hadiah ini <span>♡</span></button></div></article>`);
 } else if(s.type==='end'){
  html=frame(`<div class="paper cover"><p class="eyebrow">the end, but not really ♡</p>${catMarkup()}<h2>One last hug!</h2><p class="subtitle">Makasih ya udah baca sampai akhir, malu juga ak dipikir-pikir buat ginian kwkwkwk, semoga ini bisa jadi salah satu kenangan baik ya setelah 61 hari setelah kita kenal kwkwkwkwk, Ak mau lebih dari ini tapi when when lah aowkoakw.</p><div class="actions"><button class="btn" id="hugBtn">Kasih peluk <span>♡</span></button><button class="btn secondary" id="restartBtn">Lihat lagi dari awal ↻</button></div></div>`);
 }
 main.innerHTML=html;
 progress.style.width=`${((current+1)/stages.length)*100}%`;
 if(s.type==='cover') counter.textContent='Sentuh Gambarnya Dulu ♡';
 else if(s.type==='end') counter.textContent='a little gift, with love';
 else counter.textContent=`${String(current+1).padStart(2,'0')} / ${String(stages.length).padStart(2,'0')}`;
 backBtn.disabled=current===0;
 nextBtn.disabled=true;
 nextBtn.style.visibility='hidden';
 bindStage(s);
 window.scrollTo({top:0,behavior:'smooth'});
}
function bindStage(s){
 const cat=document.getElementById('petCat');
 if(cat){
  const pet=(e)=>{if(e && e.type==='keydown' && !['Enter',' '].includes(e.key))return; if(e&&e.type==='keydown')e.preventDefault();cat.classList.remove('petted');void cat.offsetWidth;cat.classList.add('petted');const r=cat.getBoundingClientRect();const x=e&&e.clientX?r.left+(e.clientX-r.left):r.left+r.width*.52;const y=e&&e.clientY?r.top+(e.clientY-r.top):r.top+r.height*.38;burst(x,y,7);};
  cat.addEventListener('click',pet);cat.addEventListener('keydown',pet);
 }
 const start=document.getElementById('startBtn');if(start)start.onclick=()=>goNext();
 const ls=document.getElementById('letterStart');if(ls)ls.onclick=()=>goNext();
 const ln=document.getElementById('letterNext');if(ln)ln.onclick=()=>goNext();
 const nb=document.getElementById('notesBegin');if(nb)nb.onclick=()=>goNext();
 const env=document.getElementById('envelope');if(env){env.onclick=()=>{if(revealed)return;revealed=true;env.classList.add('open');document.getElementById('envelopeHint').style.opacity='.3';document.getElementById('noteSlot').innerHTML=`<div class="revealed-note"><span class="note-heart">${s.note.icon}</span><p>${s.note.text}</p></div>`;document.getElementById('noteActions').style.display='flex';const r=env.getBoundingClientRect();burst(r.left+r.width/2,r.top+70,12);};}
 const nn=document.getElementById('noteNext');if(nn)nn.onclick=()=>goNext();
 const stickerBtn=document.getElementById('loveStickerBtn');if(stickerBtn){stickerBtn.onclick=()=>{stickerBtn.classList.remove('hugging');void stickerBtn.offsetWidth;stickerBtn.classList.add('hugging');const r=stickerBtn.getBoundingClientRect();burst(r.left+r.width*.5,r.top+r.height*.42,26);setTimeout(()=>stickerBtn.classList.remove('hugging'),950);};}
 const fin=document.getElementById('finishBtn');if(fin)fin.onclick=()=>{burst(window.innerWidth/2,window.innerHeight*.4,24);goNext();};
 const hug=document.getElementById('hugBtn');if(hug)hug.onclick=()=>{const r=cat?.getBoundingClientRect();burst(r?r.left+r.width/2:window.innerWidth/2,r?r.top+r.height/2:window.innerHeight/2,28);hug.innerHTML='big hug 🤍';};
 const restart=document.getElementById('restartBtn');if(restart)restart.onclick=()=>{current=0;render();};
}
function goNext(){if(current<stages.length-1){const old=main.querySelector('.stage');if(old){old.classList.add('leaving');setTimeout(()=>{current++;render();},170)}else{current++;render();}}}
function goBack(){if(current>0){const old=main.querySelector('.stage');if(old){old.classList.add('leaving');setTimeout(()=>{current--;render();},150)}else{current--;render();}}}
backBtn.addEventListener('click',goBack);
nextBtn.addEventListener('click',goNext);
function burst(x,y,n=8){
 const icons=['♡','♥','✧','🐾','✦'];
 for(let i=0;i<n;i++){
  const el=document.createElement('span');const paw=Math.random()<.3;el.className=paw?'paw':'heart-pop';el.textContent=icons[Math.floor(Math.random()*icons.length)];el.style.left=(x+(Math.random()-.5)*100)+'px';el.style.top=(y+(Math.random()-.5)*35)+'px';el.style.fontSize=(12+Math.random()*16)+'px';el.style.setProperty('--dx',((Math.random()-.5)*100)+'px');el.style.setProperty('--dy',(25+Math.random()*65)+'px');el.style.animationDelay=(Math.random()*.12)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1500);
 }
}
// Taps anywhere outside buttons can sprinkle a couple of tiny hearts on touch screens, without blocking reading.
document.addEventListener('pointerdown',(e)=>{if(e.pointerType==='touch' && !e.target.closest('button') && Math.random()<.16)burst(e.clientX,e.clientY,2)});
render();
</script>
</body>
</html>
